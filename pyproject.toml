[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-analysis"
dynamic = ["version"]
description = "GUI for the SC Neuropixels analysis pipeline (SC_analysis_v24)"
license = {text = "MIT"}
authors = [{name = "Gergely Szarka"}]
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23", "scipy>=1.9", "pandas>=1.5", "matplotlib>=3.6", "scikit-learn>=1.1",
  "PySide6>=6.5", "pyqtgraph>=0.13.3", "opencv-python-headless>=4.7", "tables>=3.8",
]

[project.gui-scripts]
sc-analysis = "sc_analysis.gui.main_window:main"

[tool.setuptools.dynamic]
version = {attr = "sc_analysis._version.__version__"}

[tool.setuptools.package-data]
sc_analysis = ["resources/*"]

[tool.setuptools.packages.find]
include = ["sc_analysis*"]
